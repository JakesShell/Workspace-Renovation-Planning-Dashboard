name: SpaceOps CI

on:
  push:
    branches: ["main", "upgrade/spaceops-cloud-workspace-console"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run syntax checks
        run: npm test
